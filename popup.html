<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="color-scheme" content="dark light" />
<title>LoL Schedule</title>
<link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="app">
    <header class="top">
      <h1>LoL Schedule</h1>
      <div class="controls">
        <span id="updated" class="updated">—</span>
        <button id="settingsBtn" class="icon-btn" title="Settings" aria-label="Settings">⚙</button>
        <button id="refreshBtn" class="icon-btn" title="Refresh" aria-label="Refresh">↻</button>
      </div>
    </header>

    <div id="liveStrip" class="live-strip" hidden></div>

    <main id="scheduleView" class="view">
      <div id="filters" class="chips" role="group" aria-label="Filter by league"></div>
      <div id="content" class="scroll"></div>
    </main>

    <section id="settingsView" class="view scroll" hidden>
      <div class="panel">
        <div class="panel-head">
          <span>Settings</span>
          <button id="backBtn" class="ghost" aria-label="Back to schedule">← Back</button>
        </div>

        <div class="row">
          <div class="label">Toolbar LIVE badge
            <span class="sub">Show a badge on the extension icon when a streamer is live</span>
          </div>
          <button id="badgeSwitch" class="switch" role="switch" aria-checked="false" aria-label="Toolbar LIVE badge"></button>
        </div>

        <div class="row">
          <div class="label">Desktop notifications
            <span class="sub">Get a notification when a streamer goes live</span>
          </div>
          <button id="notifySwitch" class="switch" role="switch" aria-checked="false" aria-label="Desktop notifications"></button>
        </div>

        <div class="row">
          <div class="label">Refresh interval
            <span class="sub">How often to check the schedule and your streamers</span>
          </div>
          <select id="intervalSelect" class="select" aria-label="Refresh interval"></select>
        </div>

        <div class="streamers">
          <div class="sub-head">Streamers <span id="streamerCount"></span></div>
          <div class="add">
            <input id="streamerInput" type="text" placeholder="twitch.tv/channel or name" autocomplete="off" spellcheck="false" aria-label="Twitch channel URL or name" />
            <button id="addBtn" class="primary">Add</button>
          </div>
          <p id="streamerMsg" class="msg" role="status"></p>
          <ul id="streamerList" class="streamer-list"></ul>
        </div>

        <div class="streamers leagues">
          <div class="sub-head">Leagues <span id="leagueCount"></span>
            <span class="spacer"></span>
            <button id="leagueReset" class="link">Reset</button>
            <button id="leagueClear" class="link">Clear</button>
          </div>
          <input id="leagueSearch" class="search" type="search" placeholder="Search leagues" autocomplete="off" aria-label="Search leagues" />
          <ul id="leagueList" class="league-list"></ul>
        </div>
      </div>
    </section>

    <footer id="footerNote" class="footer"></footer>
  </div>
  <script type="module" src="popup.js"></script>
</body>
</html>
